global:
  awsAccountId: ""        # fills every image + cert ARN
  awsRegion: "eu-west-1"
  ingress:
    host: ""
    certificateArn: ""


services:
  - name: productcatalogservice
    image: productcatalogservice
    tag: latest
    port: 3550
    probeType: grpc
    env:
      - name: PORT
        value: "3550"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilization: 50

  - name: currencyservice
    image: currencyservice
    tag: latest
    port: 7000
    probeType: grpc
    env:
      - name: PORT
        value: "7000"
      - name: DISABLE_PROFILER
        value: "true"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "160Mi"
  

  - name: emailservice
    image: emailservice
    tag: latest
    port: 8080
    probeType: grpc
    env: []
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  - name: paymentservice
    image: paymentservice
    tag: latest
    port: 50051
    probeType: grpc
    env:
      - name: PORT
        value: "50051"
      - name: DISABLE_PROFILER
        value: "true"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  - name: shippingservice
    image: shippingservice
    tag: latest
    port: 50051
    probeType: grpc
    env:
      - name: PORT
        value: "50051"
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"

  - name: adservice
    image: adservice
    tag: latest
    port: 9555
    probeType: grpc
    env:
      - name: PORT
        value: "9555"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "300m"
        memory: "384Mi"

  - name: cartservice
    image: cartservice
    tag: latest
    port: 7070
    probeType: grpc
    env:
      - name: REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: redis-cart-auth
            key: password
      - name: REDIS_ADDR
        value: "redis-cart:6379,password=$(REDIS_PASSWORD)"
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "300m"
        memory: "256Mi"

  - name: recommendationservice
    image: recommendationservice
    tag: latest
    port: 8080
    probeType: grpc
    env:
      - name: PORT
        value: "8080"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalogservice:3550"
    resources:
      requests:
        cpu: "100m"
        memory: "220Mi"
      limits:
        cpu: "300m"
        memory: "450Mi"
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 8
      targetCPUUtilization: 50

  - name: checkoutservice
    image: checkoutservice
    tag: latest
    port: 5050
    probeType: grpc
    env:
      - name: PORT
        value: "5050"
      - name: SHIPPING_SERVICE_ADDR
        value: "shippingservice:50051"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalogservice:3550"
      - name: CART_SERVICE_ADDR
        value: "cartservice:7070"
      - name: CURRENCY_SERVICE_ADDR
        value: "currencyservice:7000"
      - name: EMAIL_SERVICE_ADDR
        value: "emailservice:8080"
      - name: PAYMENT_SERVICE_ADDR
        value: "paymentservice:50051"
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 8
      targetCPUUtilization: 50

  - name: frontend
    image: frontend
    tag: latest
    port: 8080
    probeType: http
    probePath: /_healthz
    env:
      - name: PORT
        value: "8080"
      - name: PRODUCT_CATALOG_SERVICE_ADDR
        value: "productcatalogservice:3550"
      - name: CURRENCY_SERVICE_ADDR
        value: "currencyservice:7000"
      - name: CART_SERVICE_ADDR
        value: "cartservice:7070"
      - name: RECOMMENDATION_SERVICE_ADDR
        value: "recommendationservice:8080"
      - name: CHECKOUT_SERVICE_ADDR
        value: "checkoutservice:5050"
      - name: SHIPPING_SERVICE_ADDR
        value: "shippingservice:50051"
      - name: AD_SERVICE_ADDR
        value: "adservice:9555"
      - name: SHOPPING_ASSISTANT_SERVICE_ADDR
        value: "shoppingassistantservice:8080"
      - name: COLLECTOR_SERVICE_ADDR
        value: "otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
      - name: ENABLE_TRACING
        value: "1"
    resources:
      requests:
        cpu: "100m"
        memory: "64Mi"
      limits:
        cpu: "200m"
        memory: "128Mi"
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilization: 50

# Load generator (Locust) — drives traffic at the frontend to exercise HPA + Karpenter.
loadgenerator:
  enabled: true
  users: 1000     # concurrent Locust users
  rate: 100      # users spawned per second