apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cartservice-policy
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: cartservice
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: [{podSelector: {matchLabels: {app: frontend}}}]
      ports: [{protocol: TCP, port: 7070}]
    - from: [{podSelector: {matchLabels: {app: checkoutservice}}}]
      ports: [{protocol: TCP, port: 7070}]
  egress:
    - to: [{podSelector: {matchLabels: {app: redis-cart}}}]
      ports: [{protocol: TCP, port: 6379}]