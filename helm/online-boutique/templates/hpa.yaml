{{- range .Values.services }}
{{- if .hpa }}
{{- if .hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .name }}
  namespace: apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .name }}
  minReplicas: {{ .hpa.minReplicas }}
  maxReplicas: {{ .hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .hpa.targetCPUUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .hpa.targetMemoryUtilization }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        # Percent instead of a fixed pod count: removes half the excess
        # replicas every 60s, so scale-down speeds up the further above
        # target you are, instead of crawling down 2 pods/min no matter
        # how high the peak was (30 -> 2 took ~14min with a fixed count,
        # ~4min with this).
        - type: Percent
          value: 50
          periodSeconds: 60
---
{{- end }}
{{- end }}
{{- end }}