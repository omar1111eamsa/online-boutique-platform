apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-cart-auth
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: redis-cart-auth
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: boutique-dev-redis-cart-auth   # the Secrets Manager secret NAME from secrets.tf
        property: password