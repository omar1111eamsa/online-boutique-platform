apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: boutique-dev-karpenter-node-role
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        Name: boutique-dev-private-*
  securityGroupSelectorTerms:
    - tags:
        kubernetes.io/cluster/boutique-dev: owned
  # Karpenter only attaches tags listed here to instances/launch templates it
  # creates. The IAM policy's RunInstances/CreateFleet/CreateTags Condition
  # requires this exact tag -- without it here, every launch is denied.
  tags:
    kubernetes.io/cluster/boutique-dev: owned
  # Default hop limit (1) only lets the host OS reach the EC2 instance
  # metadata service, not pods (they're an extra network hop away) --
  # breaks anything relying on IMDS auto-detection from inside a pod,
  # like the AWS Load Balancer Controller's VPC auto-detect.
  metadataOptions:
    httpEndpoint: enabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  # Without a reservation, pods can consume 100% of the node's CPU/memory,
  # starving kubelet itself -- it misses its heartbeat to the API server
  # ("Kubelet stopped posting node status") and the node goes NotReady
  # even though the instance is perfectly healthy. This carves out a
  # slice the scheduler can never assign to pods, so kubelet always gets
  # to run regardless of how overcommitted the pods are.
  kubelet:
    systemReserved:
      cpu: 250m
      memory: 500Mi
    kubeReserved:
      cpu: 250m
      memory: 500Mi
    evictionHard:
      memory.available: 5%
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["c7i-flex.large", "m7i-flex.large"]
  limits:
    cpu: "64"   # ~32 nodes max (2 vCPU each) -- was 16 (~8 nodes), too tight for the 200-maxReplicas target
    nodes: "32" # explicit node-count cap as a second safety net alongside the CPU limit
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
