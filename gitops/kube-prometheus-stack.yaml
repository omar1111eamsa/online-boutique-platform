apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "90.1.1"
    helm:
      values: |
        grafana:
          adminPassword: "Admin123!"
          additionalDataSources:
            - name: Tempo
              type: tempo
              access: proxy
              url: http://tempo.monitoring.svc.cluster.local:3200
              editable: true
          ingress:
            enabled: true
            ingressClassName: alb
            hosts:
              - grafana.myser.serghini.me
            annotations:
              alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:900182162489:certificate/cece6399-bd30-42d9-9d7b-41981b01cc9f
              alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
              alb.ingress.kubernetes.io/scheme: internet-facing
              alb.ingress.kubernetes.io/ssl-redirect: "443"
              alb.ingress.kubernetes.io/target-type: ip
              external-dns.alpha.kubernetes.io/hostname: grafana.myser.serghini.me
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    # aws-load-balancer-controller adds this finalizer to the live Ingress
    # so it can clean up the ALB on delete -- it's never in git, so without
    # this it always shows as OutOfSync even when nothing is actually wrong.
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /metadata/finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
