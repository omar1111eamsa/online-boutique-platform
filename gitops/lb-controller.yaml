apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.5.0
    helm:
      values: |
        clusterName: boutique-dev
        # vpcId intentionally omitted: it's auto-detected from the node's
        # EC2 instance metadata at runtime. A hardcoded value here goes
        # stale on every terraform destroy+apply (new VPC ID each time)
        # since nothing regenerates this static, git-committed file.
        serviceAccount:
          create: false
          name: aws-load-balancer-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
