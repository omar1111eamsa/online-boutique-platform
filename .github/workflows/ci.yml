name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REGISTRY: 858093957996.dkr.ecr.eu-west-1.amazonaws.com

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: frontend
            context: microservices-demo/src/frontend
          - name: adservice
            context: microservices-demo/src/adservice
          - name: cartservice
            context: microservices-demo/src/cartservice/src
          - name: checkoutservice
            context: microservices-demo/src/checkoutservice
          - name: currencyservice
            context: microservices-demo/src/currencyservice
          - name: emailservice
            context: microservices-demo/src/emailservice
          - name: paymentservice
            context: microservices-demo/src/paymentservice
          - name: productcatalogservice
            context: microservices-demo/src/productcatalogservice
          - name: recommendationservice
            context: microservices-demo/src/recommendationservice
          - name: shippingservice
            context: microservices-demo/src/shippingservice

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ matrix.service.context }}
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Build image
        run: |
          docker build -t ${{ matrix.service.name }}:${{ github.sha }} ${{ matrix.service.context }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service.name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::858093957996:role/github-actions-ci-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ matrix.service.name }}:${{ github.sha }} ${{ env.ECR_REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}
          docker tag ${{ matrix.service.name }}:${{ github.sha }} ${{ env.ECR_REGISTRY }}/${{ matrix.service.name }}:latest
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}
          docker push ${{ env.ECR_REGISTRY }}/${{ matrix.service.name }}:latest