apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emailservice
  template:
    metadata:
      labels:
        app: emailservice
    spec:
      containers:
        - name: emailservice
          image: 858093957996.dkr.ecr.eu-west-1.amazonaws.com/emailservice:v1
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            grpc:
              port: 8080
          livenessProbe:
            grpc:
              port: 8080
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: emailservice
  ports:
    - port: 8080
      targetPort: 8080
